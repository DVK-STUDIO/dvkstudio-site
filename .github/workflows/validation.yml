name: Validation de la proposition
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DVK_PUBLIC_BUILD: '1'
      - run: npm run check:public -- --golive
      - run: npm run check:site
      - run: npm run check:capacites
